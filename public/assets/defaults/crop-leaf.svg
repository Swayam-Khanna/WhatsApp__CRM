<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7F2"/>
      <stop offset="100%" stop-color="#E2EBE2"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F3D2E"/>
      <stop offset="50%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="50%" stop-color="#40916C"/>
      <stop offset="100%" stop-color="#74C69D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgL)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#C8D6C8" stroke-width="2" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- Petiole / Stem -->
  <path d="M 120 330 C 150 310, 185 260, 215 190" fill="none" stroke="#2D6A4F" stroke-width="10" stroke-linecap="round"/>

  <!-- Main Big Leaf -->
  <path d="M 140 290 C 80 180, 180 80, 290 85 C 295 195, 250 295, 140 290 Z" fill="url(#leafGrad)"/>

  <!-- Secondary Overlay Half Leaf for 3D depth -->
  <path d="M 140 290 C 150 200, 220 130, 290 85 C 295 195, 250 295, 140 290 Z" fill="url(#leafGrad2)" opacity="0.65"/>

  <!-- Leaf Center Vein -->
  <path d="M 140 290 Q 210 200 290 85" fill="none" stroke="#D8F3DC" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Side Veins -->
  <path d="M 175 245 Q 155 220 135 225" fill="none" stroke="#B7E4C7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 185 235 Q 215 230 235 250" fill="none" stroke="#B7E4C7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M 215 190 Q 185 170 170 170" fill="none" stroke="#B7E4C7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 225 180 Q 255 170 270 190" fill="none" stroke="#B7E4C7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M 250 140 Q 230 125 215 125" fill="none" stroke="#B7E4C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 260 130 Q 275 125 285 135" fill="none" stroke="#B7E4C7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
